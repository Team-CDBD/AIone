services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-companyx}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # 비밀번호에는 기본값을 두지 않는다 — 기본값이 있으면 아무도 바꾸지 않고 그대로 배포된다.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — scripts/setup.sh가 만들어 준다}"
      MCP_READER_PASSWORD: "${MCP_READER_PASSWORD:?set MCP_READER_PASSWORD in .env — scripts/setup.sh가 만들어 준다}"
      MCP_CONFIG_PASSWORD: "${MCP_CONFIG_PASSWORD:?set MCP_CONFIG_PASSWORD in .env — scripts/setup.sh가 만들어 준다}"
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d companyx"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Ollama는 compose가 관리하지 않는다 — 외부 인스턴스를 쓰며 OLLAMA_URL로 주입한다(.env 참조).
  mcp:
    build:
      context: .
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    environment:
      PG_DSN: "postgresql://mcp_reader:${MCP_READER_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-companyx}"
      # 기본값을 두지 않는다 — 기동돼 있지 않은 주소를 조용히 가리키면 배포본이 조용히 실패한다.
      OLLAMA_URL: "${OLLAMA_URL:?set OLLAMA_URL in .env — see .env.example}"
      GENERATE_MODEL: ${GENERATE_MODEL:-gemma4:e4b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text:latest}
      TOP_K: ${TOP_K:-5}
      TAU: ${TAU:-0.55}
      KG_ENGINE: python  # python|jena|shadow. jena/shadow는 §P2/P3 실연결 전까지 python과 동일하게 동작.
    volumes:
      - ./data:/app/data:ro  # `docker compose run --rm mcp python -m ingest data/....zip`가 -v 없이 바로 되게.
    depends_on:
      postgres: {condition: service_healthy}
  # 웹 화면. mcp와 같은 이미지·같은 registry를 쓰고 전송 방식만 HTTP다.
  # mcp 서비스(stdio)는 그대로 두므로 MCP 클라이언트 경로에는 영향이 없다.
  web:
    build:
      context: .
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    command: ["python", "-m", "adapters.http_server"]
    environment:
      PG_DSN: "postgresql://mcp_reader:${MCP_READER_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-companyx}"
      OLLAMA_URL: "${OLLAMA_URL:?set OLLAMA_URL in .env — see .env.example}"
      GENERATE_MODEL: ${GENERATE_MODEL:-gemma4:e4b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text:latest}
      TOP_K: ${TOP_K:-5}
      TAU: ${TAU:-0.55}
      KG_ENGINE: python
      WEB_PORT: ${WEB_PORT:-8080}
      # 접속 프로필 저장소. mcp_config는 server_connections 한 테이블에만 권한이 있다(sql/06).
      # stdio(mcp) 서비스에는 주지 않는다 — 서버를 바꿔 붙이는 것은 화면의 기능이다.
      CONFIG_PG_DSN: "postgresql://mcp_config:${MCP_CONFIG_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-companyx}"
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
volumes: {pgdata: {}}
