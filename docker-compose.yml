services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: companyx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d companyx"]
      interval: 5s
      timeout: 3s
      retries: 10
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
  mcp:
    build: .
    environment:
      PG_DSN: postgresql://mcp_reader:${MCP_READER_PASSWORD}@postgres:5432/companyx
      OLLAMA_URL: http://ollama:11434
      GENERATE_MODEL: gemma4:e4b
      EMBED_MODEL: nomic-embed-text:latest
      TOP_K: 5
      TAU: 0.55
      KG_ENGINE: python  # python|jena|shadow. jena/shadow는 §P2/P3 실연결 전까지 python과 동일하게 동작.
    volumes:
      - ./data:/app/data:ro  # `docker compose run --rm mcp python -m ingest data/....zip`가 -v 없이 바로 되게.
    depends_on:
      postgres: {condition: service_healthy}
volumes: {pgdata: {}, ollama: {}}
