[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-companyx"
version = "0.1.0"
description = "MCP based intelligent data platform cluster"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mcp>=1.0",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "sqlglot>=25.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "jsonschema>=4.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["ingest"]

[tool.setuptools.package-data]
router = ["rules/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
